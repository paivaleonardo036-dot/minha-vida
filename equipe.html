<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demandas da Quadra</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Quadra">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ec;--card:#fff;--ink:#2b2b3a;--mut:#75758a;--line:#eadfc8;--home:#7c5cff;--cha:#2fa866;--lav:#2b8cff;--qd:#ff5c7a;--pes:#f0a020;--pp:#14b8a6;--ag:#9b59b6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ff;--mut:#a9a6c2;--line:#3d3b52}}
:root[data-theme="dark"]{--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ff;--mut:#a9a6c2;--line:#3d3b52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:18px}
.wrap{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:6px 0 12px}
h2{font-size:22px;margin:20px 0 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1 1 140px;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:20px;padding:12px 8px;font:inherit;font-weight:bold;cursor:pointer}
.tab.on{background:var(--c);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.big{width:100%;text-align:left;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:22px;padding:16px;margin:10px 0;font:inherit;cursor:pointer;display:block}
.big b{font-size:22px}.big span{display:block;color:var(--mut);margin-top:4px;font-size:16px}
.add{display:flex;gap:8px;flex-wrap:wrap}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
#nt{flex:1 1 200px}
textarea{width:100%;min-height:110px}
.btn{border:0;border-radius:14px;background:var(--c);color:#fff;font:inherit;font-weight:bold;padding:10px 16px;cursor:pointer}
.mini{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-size:15px;padding:6px 10px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row .t{flex:1 1 160px}
.done .t{text-decoration:line-through;color:var(--mut)}
.tag{font-size:14px;border-radius:10px;padding:2px 8px;background:var(--line)}
.late{background:#ff5c7a;color:#fff}
.empty{color:var(--mut);font-size:16px}
select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
summary{font-size:20px;cursor:pointer;margin-bottom:6px}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--c)}
.mini.sel{background:var(--c);color:#fff;border-color:transparent}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi div{background:var(--bg);border-radius:14px;padding:10px}.kpi b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.c0{color:var(--mut)}
.cd{border:2px solid var(--line);border-radius:10px;padding:4px 0;min-height:44px;font-size:15px}.hj{border-color:var(--qd);font-weight:bold}
.dot{display:block;background:var(--qd);color:#fff;border-radius:8px;font-size:12px;margin:2px 5px 0}
.cnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sync{font-size:13px;color:var(--mut);text-align:right;margin:2px 4px 8px}.x{margin-left:auto;border:0;background:transparent;color:var(--mut);opacity:.4;font-size:12px;padding:2px 4px;cursor:pointer;align-self:flex-start}
.tab.lg{flex:2 1 220px;font-size:21px;padding:18px 8px}
.tab.sm{flex:0 0 auto;padding:5px 10px;font-size:13px;border-width:2px;border-radius:14px}
.big.lg{padding:24px 16px;border-width:4px}.big.lg b{font-size:28px}
.big.sm{padding:8px 12px;border-width:2px;border-radius:16px;margin:8px 0;width:auto;display:inline-block}.big.sm b{font-size:15px}.big.sm span{display:inline;margin-left:8px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .big{margin:0;height:100%}
.row.urg{background:rgba(255,92,122,.16);border-left:6px solid #ff5c7a;border-radius:12px;padding-left:10px}
.tag.hot{background:#ff5c7a;color:#fff;font-weight:bold}
.total{margin-top:10px;padding:10px;border-radius:12px;background:var(--bg)}
.num{width:110px}small{color:var(--mut)}
</style>
</head>
<body><div class="wrap" id="auth" style="padding-bottom:0"></div><div class="wrap" id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,onSnapshot,setDoc,deleteDoc,collection}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCkelAkEWCp2A_cCbD6Q95k0ZC2dLg3eCM",authDomain:"vida-do-leo.firebaseapp.com",projectId:"vida-do-leo",appId:"1:512063173608:web:3103e3950d9b1b34666a5d"};
const $=s=>document.querySelector(s),g=i=>$('#'+i).value.trim(),A=document.getElementById('auth');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d.split('-').reverse().slice(0,2).join('/'),today=()=>new Date().toLocaleDateString('sv-SE');
const NOMES=['Felipe','Tuts','Fabio','Mari','Leo'],toDB=n=>n==='Leo'?'Eu':n,fromDB=n=>n==='Eu'?'Leo':n;
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
let list=[],clientes=[],pf='Todos',msg='',unsubs=[],db,auth;
const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
const put=(id,o)=>setDoc(doc(db,'demandas',String(id)),o,{merge:true}).catch(()=>alert('Não foi possível salvar. Confira a conexão.'));
window.addD=()=>{const t=g('dt');if(!t)return;put(Date.now()*1000+Math.floor(Math.random()*1000),{c:$('#dc').value,t,d:$('#dd').value,r:toDB($('#dr').value),urg:$('#du').checked,ok:false})};
window.setOk=(id,v)=>put(id,{ok:v});window.setUrg=(id,v)=>put(id,{urg:v});
window.delD=id=>{if(confirm('Apagar esta demanda?'))deleteDoc(doc(db,'demandas',String(id)))};
window.setPf=n=>{pf=n;render()};
function render(){const T=today(),P=list.filter(p=>pf==='Todos'||fromDB(p.r)===pf).sort((a,b)=>(b.urg?1:0)-(a.urg?1:0)||((a.d||'9')<(b.d||'9')?-1:1));
const row=p=>`<div class="row ${p.urg&&!p.ok?'urg':''} ${p.ok?'done':''}"><input type="checkbox" ${p.ok?'checked':''} onchange="setOk(${p.id},this.checked)"><span class="t"><b>${esc(p.c)}</b>: ${esc(p.t)}</span>${p.urg&&!p.ok?'<span class="tag hot">🔥 URGENTE</span>':''}<span class="tag">👤 ${esc(fromDB(p.r))}</span>${p.d?`<span class="tag ${p.d<T&&!p.ok?'late':''}">📅 ${fd(p.d)}</span>`:''}${p.ok?'':`<button class="mini ${p.urg?'sel':''}" onclick="setUrg(${p.id},${!p.urg})">🔥</button>`}<button class="x" onclick="delD(${p.id})">🗑</button></div>`;
const o=P.filter(p=>!p.ok),f=P.filter(p=>p.ok);
$('#app').innerHTML=`<div style="--c:var(--qd)"><h1 style="color:var(--qd)">📣 Demandas da Quadra</h1>${msg?`<div class="card">${esc(msg)}</div>`:''}<div class="card add"><select id="dc">${opts(['Geral',...clientes])}</select><input id="dt" placeholder="Qual a demanda?"><input id="dd" type="date"><select id="dr">${opts(NOMES)}</select><label class="tag" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="du"> 🔥 Urgente</label><button class="btn" onclick="addD()">＋ Adicionar</button></div><div class="sub">${['Todos',...NOMES].map(r=>`<button class="mini ${pf===r?'sel':''}" onclick="setPf('${r}')">${r}</button>`).join('')}</div><h2>⏳ Abertas (${o.length})</h2><div class="card">${o.map(row).join('')||'<div class="empty">Tudo em dia! 🌈</div>'}</div><h2>✅ Resolvidas (${f.length})</h2><div class="card">${f.map(row).join('')||'<div class="empty">Vazio.</div>'}</div></div>`}
function form(m){$('#app').innerHTML='';A.innerHTML=`<div class="card" style="margin:14px auto 0;max-width:820px"><b>🔐 Demandas da Quadra: entrar</b><div class="add" style="margin-top:8px"><input id="lgEmail" type="email" placeholder="Email" autocomplete="username"><input id="lgPass" type="password" placeholder="Senha" autocomplete="current-password"><button class="btn" id="lgGo" style="--c:#ff5c7a">Entrar</button></div><div class="empty" id="lgMsg" style="margin-top:6px">${m||''}</div><a href="#" id="lgRes" class="empty">Esqueci a senha</a></div>`;
document.getElementById('lgGo').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('lgEmail').value.trim(),document.getElementById('lgPass').value)}catch(e){document.getElementById('lgMsg').textContent='Email ou senha incorretos.'}};
document.getElementById('lgRes').onclick=async e=>{e.preventDefault();const em=document.getElementById('lgEmail').value.trim();if(!em){document.getElementById('lgMsg').textContent='Digite seu email acima e toque de novo.';return}try{await sendPasswordResetEmail(auth,em)}catch(x){}document.getElementById('lgMsg').textContent='Se o email estiver cadastrado, enviamos um link para criar nova senha.'}}
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];list=[];clientes=[];msg='';
if(!u){form();return}
A.innerHTML=`<div class="sync">👤 ${esc(u.email)} · <a href="#" id="lgOut">Sair</a></div>`;document.getElementById('lgOut').onclick=e=>{e.preventDefault();signOut(auth)};
const deny=()=>{msg='Seu email não tem acesso a esta página. Fale com o Leo.';render()};
unsubs.push(onSnapshot(collection(db,'demandas'),sn=>{list=sn.docs.map(d=>Object.assign({},d.data(),{id:Number(d.id)}));render()},deny));
unsubs.push(onSnapshot(doc(db,'config','quadra'),sn=>{clientes=sn.exists()?(sn.data().clientes||[]):[];render()},()=>{}));
render()});
</script>
</body></html>
