<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quadra System · Equipe</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Quadra"><meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="logo.png"><link rel="apple-touch-icon" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--card:#121214;--card2:#18181b;--ink:#f4f4f5;--mut:#8b8b93;--line:#242428;--lime:#c9e723;--red:#ff4d6d;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(900px 420px at 85% -10%,rgba(201,231,35,.11),transparent 60%),var(--bg);font:15px/1.45 Inter,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px}
h2{font:700 12px "Space Grotesk",Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:26px 4px 10px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}.brand img{width:46px;height:46px;border-radius:13px;box-shadow:0 0 0 1px #2a2a2e,0 8px 26px rgba(201,231,35,.14)}
.brand b{font:700 18px "Space Grotesk",Inter,sans-serif;letter-spacing:.16em}.brand b small{display:block;font:600 11px Inter,sans-serif;letter-spacing:.2em;color:var(--lime);margin-top:3px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:10px 0 4px}
.tab{flex:1;border:0;background:transparent;color:var(--mut);padding:11px 8px;border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer;transition:.2s}
.tab.on{background:var(--lime);color:#0a0a0a;box-shadow:0 4px 18px rgba(201,231,35,.25)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0}
.add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:#0d0d0f;border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(201,231,35,.15)}input::placeholder{color:#5d5d66}
.btn{border:0;border-radius:999px;background:var(--lime);color:#0a0a0a;font:700 14px Inter,sans-serif;padding:11px 18px;cursor:pointer;transition:transform .15s,box-shadow .2s;text-decoration:none;display:inline-block}
.btn:hover{box-shadow:0 6px 22px rgba(201,231,35,.28)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--lime);border:1px solid rgba(201,231,35,.45)}
.mini{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;font:600 13px Inter,sans-serif;padding:7px 12px;cursor:pointer}
.mini.sel{background:var(--lime);color:#0a0a0a;border-color:var(--lime)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}.row .t{flex:1 1 180px}
.row.urg{background:linear-gradient(90deg,rgba(255,77,109,.15),transparent);border-left:3px solid var(--red);padding-left:12px;margin-left:-4px;border-radius:4px}
.done .t{text-decoration:line-through;color:var(--mut)}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--card2);border:1px solid var(--line);color:#c9c9d0;text-decoration:none}
.tag.late{background:rgba(255,77,109,.15);border-color:rgba(255,77,109,.4);color:#ff8fa3}.tag.hot{background:var(--red);border-color:var(--red);color:#fff}
.x{margin-left:auto;border:0;background:transparent;color:var(--mut);opacity:.5;font-size:13px;padding:4px 6px;cursor:pointer}.x+.x{margin-left:0}.x:hover{opacity:1}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:22px;padding:0;border-radius:7px;border:2px solid #3a3a40;background:transparent;display:inline-grid;place-content:center;cursor:pointer;flex:none;transition:.15s}
input[type=checkbox]:checked{background:var(--lime);border-color:var(--lime)}input[type=checkbox]:checked::after{content:"✓";color:#0a0a0a;font-weight:900;font-size:14px;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;background:#0d0d0f}
.empty{color:var(--mut);font-size:14px}small{color:var(--mut)}.sync{font-size:12px;color:var(--mut);text-align:right;margin:2px 4px 8px}.sync a{color:var(--lime)}
.cnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.c0{color:var(--mut);font-size:12px}
.cd{border:1px solid var(--line);border-radius:12px;padding:6px 0;min-height:46px;font-size:14px;background:#0d0d0f}.hj{border-color:var(--lime);color:var(--lime);font-weight:700}
.dot{display:block;background:var(--lime);color:#0a0a0a;border-radius:8px;font-size:11px;font-weight:700;margin:3px 6px 0}
.bar{height:10px;border-radius:99px;background:#202024;overflow:hidden;margin:10px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#9fbf12,var(--lime));border-radius:99px;animation:grow .8s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
.vgrid{display:flex;flex-wrap:wrap;gap:8px}.vc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-weight:700;background:#0d0d0f;cursor:pointer;transition:.2s}.vc.on{background:rgba(201,231,35,.12);border-color:var(--lime);color:var(--lime)}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes toast{0%{transform:translate(-50%,40px);opacity:0}15%,80%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-20px);opacity:0}}
.pf{position:fixed;z-index:99;pointer-events:none;width:10px;height:10px;border-radius:3px;animation:fly .9s ease-out forwards}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:100;background:#000;color:var(--lime);border:1px solid rgba(201,231,35,.5);padding:12px 18px;border-radius:30px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast 2.2s ease forwards;pointer-events:none;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){.pf{display:none}}
</style>
</head>

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
function celebrate(ev,m,big){const r=ev&&ev.target&&ev.target.getBoundingClientRect?ev.target.getBoundingClientRect():null,cx=r?r.left+r.width/2:innerWidth/2,cy=r?r.top+r.height/2:innerHeight/2,n=big?60:22,cols=['#c9e723','#ff5c7a','#7c5cff','#2b8cff','#f0a020','#14b8a6'];
for(let i=0;i<n;i++){const p=document.createElement('i'),a=Math.random()*6.28,d=(big?160:90)+Math.random()*(big?220:110);p.className='pf';p.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[i%6]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px;--rot:${Math.random()*720}deg`;document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}

function demV(){const T=today(),P=list.filter(p=>pf==='Todos'||rl(p).map(disp).includes(pf)).sort((a,b)=>(b.urg?1:0)-(a.urg?1:0)||((a.d||'9')<(b.d||'9')?-1:1));
const edit=p=>{const cl=['Geral',...clientes];if(!cl.includes(p.c))cl.push(p.c);return `<div class="row" style="background:var(--bg);border-radius:12px;padding:10px"><div class="add" style="width:100%"><select id="ec">${cl.map(n=>`<option value="${esc(n)}" ${n===p.c?'selected':''}>${esc(cl_(n))}</option>`).join('')}</select><input id="et" value="${esc(p.t)}" style="flex:1 1 200px"><input id="ed" type="date" value="${p.d||''}">${chips('rse',rl(p))}<label class="chip"><input type="checkbox" id="eu" ${p.urg?'checked':''}> 🔥 Urgente</label><button class="btn" onclick="saveD(${p.id})">💾 Salvar</button><button class="mini" onclick="editId=0;render()">Cancelar</button></div></div>`};
const row=p=>editId===p.id?edit(p):`<div class="row ${p.urg&&!p.ok?'urg':''} ${p.ok?'done':''}"><input type="checkbox" ${p.ok?'checked':''} onchange="setOk(${p.id},this.checked)"><span class="t"><b>${esc(cl_(p.c))}</b>: ${esc(p.t)}</span>${p.urg&&!p.ok?'<span class="tag hot">🔥 URGENTE</span>':''}<span class="tag">👤 ${rl(p).map(disp).map(esc).join(', ')}</span>${p.d?`<span class="tag ${p.d<T&&!p.ok?'late':''}">📅 ${fd(p.d)}</span>`:''}${p.ok?'':`<button class="mini ${p.urg?'sel':''}" onclick="setUrg(${p.id},${!p.urg})">🔥</button>`}<button class="x" onclick="edD(${p.id})">✏️</button><button class="x" onclick="delD(${p.id})">🗑</button>${p.ok?`<div style="flex-basis:100%;display:flex;gap:6px;align-items:center"><input placeholder="🔗 Link do arquivo entregue" value="${esc(p.link||'')}" onchange="setLink(${p.id},this.value.trim())" style="flex:1">${okU(p.link)?`<a class="tag" href="${esc(p.link)}" target="_blank" rel="noopener">Abrir</a>`:''}</div>`:''}</div>`;
const o=P.filter(p=>!p.ok),f=P.filter(p=>p.ok);
return `<div class="card add"><select id="dc">${copts(['Geral',...clientes])}</select><input id="dt" placeholder="Qual a demanda?" style="flex:1 1 200px"><input id="dd" type="date">${chips('rs',[])}<label class="chip"><input type="checkbox" id="du"> 🔥 Urgente</label><button class="btn" onclick="addD()">＋ Adicionar</button></div><div class="sub">${['Todos',...NOMES].map(r=>`<button class="mini ${pf===r?'sel':''}" onclick="setPf('${r}')">${r}</button>`).join('')}</div>${pf==='Felipe'?'<h2>🎯 Entregas do mês</h2>'+entV():''}<h2>⏳ Abertas (${o.length})</h2><div class="card">${o.map(row).join('')||'<div class="empty">Tudo em dia! 🌈</div>'}</div><h2>✅ Resolvidas (${f.length})</h2><div class="card">${f.map(row).join('')||'<div class="empty">Vazio.</div>'}</div>`}
function gravV(){const y=cmo.getFullYear(),m=cmo.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),ms=y+'-'+String(m+1).padStart(2,'0');
let h=['D','S','T','Q','Q','S','S'].map(x=>`<b class="c0">${x}</b>`).join('')+'<i></i>'.repeat(f);
for(let i=1;i<=n;i++){const ds=ms+'-'+String(i).padStart(2,'0'),c=gravs.filter(e=>e.date===ds).length;h+=`<div class="cd ${ds===today()?'hj':''}">${i}${c?`<span class="dot">${c}</span>`:''}</div>`}
const L=gravs.filter(e=>e.date.startsWith(ms)).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1);
const grow=e=>editG===e.id?`<div class="row" style="flex-direction:column;align-items:stretch"><div class="add"><input id="gdate" type="date" value="${e.date}"><input id="gtime" type="time" value="${e.time||''}"><input id="glab" value="${esc(e.label)}" style="flex:1 1 200px"></div><div class="add"><button class="btn" onclick="saveG(${e.id})">💾 Salvar</button><button class="mini" onclick="editG=0;render()">Cancelar</button></div></div>`:`<div class="row"><span class="tag">${fd(e.date)} ${e.time||''}</span><span class="t">${esc(e.label)}</span><button class="x" onclick="edG(${e.id})">✏️</button><button class="x" onclick="delG(${e.id})">🗑</button></div>`;
return `${gmsg?`<div class="card">${esc(gmsg)}</div>`:''}<div class="card add"><select id="gc">${opts(clientes)}</select><input id="gd" type="date"><input id="gh" type="time"><input id="gn" placeholder="Local / observação"><button class="btn" onclick="addG()">＋ Gravação</button></div><div class="card"><div class="cnav"><button class="mini" onclick="shiftM(-1)">◀</button><b>${MES[m]} ${y}</b><button class="mini" onclick="shiftM(1)">▶</button></div><div class="grid">${h}</div></div><div class="card">${L.map(grow).join('')||'<div class="empty">Nada neste mês.</div>'}</div>`}
function entV(){entNames=Object.keys(videos).filter(k=>videos[k]>0);const[y,mo]=emo.split('-').map(Number);
const nav=`<div class="cnav"><button class="mini" onclick="shiftE(-1)">◀</button><b>${MES[mo-1]} ${y}</b><button class="mini" onclick="shiftE(1)">▶</button></div>`;
if(!entNames.length)return `<div class="card">${nav}<div class="empty">Ainda não há clientes com vídeos combinados. O Leo precisa abrir o app principal uma vez para sincronizar.</div></div>`;
let tot=0,done=0;
const cards=entNames.map((c,ix)=>{const n=videos[c],v=(ents[eid(c)]||{}).v||[],dn=Array.from({length:n},(_,k)=>!!v[k]).filter(Boolean).length;tot+=n;done+=dn;
return `<div class="card"><div class="cnav"><b>${esc(c)}</b><span class="tag" ${dn===n?'style="background:var(--lime);border-color:var(--lime);color:#0a0a0a"':''}>${dn===n?'🏆 ':''}${dn}/${n} vídeos</span></div><div class="bar"><i style="width:${dn/n*100}%"></i></div><div class="vgrid">${Array.from({length:n},(_,i)=>`<label class="vc ${v[i]?'on':''}"><input type="checkbox" ${v[i]?'checked':''} onchange="tgV(${ix},${i},this.checked)"> ${i+1}</label>`).join('')}</div></div>`}).join('');
return `<div class="card">${nav}<b>📊 ${done}/${tot} vídeos entregues no mês</b><div class="bar"><i style="width:${tot?done/tot*100:0}%"></i></div></div>${cards}`}
function render(){const T=[['dem','✅ Demandas'],['grav','🎬 Gravações']];
$('#app').innerHTML=`<div><div class="brand"><img src="${LOGO}" alt=""><b>QUADRA SYSTEM<small>EQUIPE</small></b></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><a class="btn ghost" href="${DRIVE_URL}" target="_blank" rel="noopener">📁 Drive da Quadra</a></div>${msg?`<div class="card">${esc(msg)}</div>`:''}<div class="tabs">${T.map(([i,n])=>`<button class="tab ${tab===i?'on':''}" onclick="goTab('${i}')">${n}</button>`).join('')}</div>${tab==='grav'?gravV():demV()}</div>`}
function form(m){$('#app').innerHTML='';A.innerHTML=`<div class="brand" style="margin-top:14px"><img src="${LOGO}" alt=""><b>QUADRA SYSTEM<small>EQUIPE</small></b></div><div class="card" style="max-width:820px"><b>🔐 Entrar</b><div class="add" style="margin-top:8px"><input id="lgEmail" type="email" placeholder="Email" autocomplete="username"><input id="lgPass" type="password" placeholder="Senha" autocomplete="current-password"><button class="btn" id="lgGo">Entrar</button></div><div class="empty" id="lgMsg" style="margin-top:6px">${m||''}</div><a href="#" id="lgRes" class="empty">Esqueci a senha</a></div>`;
document.getElementById('lgGo').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('lgEmail').value.trim(),document.getElementById('lgPass').value)}catch(e){document.getElementById('lgMsg').textContent='Email ou senha incorretos.'}};
document.getElementById('lgRes').onclick=async e=>{e.preventDefault();const em=document.getElementById('lgEmail').value.trim();if(!em){document.getElementById('lgMsg').textContent='Digite seu email acima e toque de novo.';return}try{await sendPasswordResetEmail(auth,em)}catch(x){}document.getElementById('lgMsg').textContent='Se o email estiver cadastrado, enviamos um link para criar nova senha.'}}
window.render=render;
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];list=[];gravs=[];ents={};clientes=[];videos={};msg='';
if(!u){form();return}
A.innerHTML=`<div class="sync">👤 ${esc(u.email)} · <a href="#" id="lgOut">Sair</a></div>`;document.getElementById('lgOut').onclick=e=>{e.preventDefault();signOut(auth)};
const deny=()=>{msg='Seu email não tem acesso a esta página. Fale com o Leo.';render()};
const arr=(sn)=>sn.docs.map(d=>Object.assign({},d.data(),{id:Number(d.id)}));
unsubs.push(onSnapshot(collection(db,'demandas'),sn=>{list=arr(sn);render()},deny));
unsubs.push(onSnapshot(collection(db,'gravacoes'),sn=>{gravs=arr(sn);gmsg='';render()},e=>{gmsg='⚠️ Sem acesso ao calendário de gravações ('+(e.code||'erro')+'). Avise o Leo: as regras do banco precisam ser atualizadas.';render()}));
unsubs.push(onSnapshot(collection(db,'entregas'),sn=>{ents={};sn.docs.forEach(d=>ents[d.id]=d.data());render()},()=>{}));
unsubs.push(onSnapshot(doc(db,'config','quadra'),sn=>{const d=sn.exists()?sn.data():{};clientes=d.clientes||[];videos=d.videos||{};render()},()=>{}));
render()});
</script>
</body></html>
