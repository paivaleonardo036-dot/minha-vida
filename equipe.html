<link rel="icon" href="logo.png"><link rel="apple-touch-icon" href="logo.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ec;--card:#fff;--ink:#2b2b3a;--mut:#75758a;--line:#eadfc8;--home:#7c5cff;--cha:#2fa866;--lav:#2b8cff;--qd:#c9e723;--mc:#ff8c42;--pes:#f0a020;--pp:#14b8a6;--ag:#9b59b6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ff;--mut:#a9a6c2;--line:#3d3b52}}
:root[data-theme="dark"]{--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ff;--mut:#a9a6c2;--line:#3d3b52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:18px}
.wrap{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:6px 0 12px}
h2{font-size:22px;margin:20px 0 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1 1 140px;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:20px;padding:12px 8px;font:inherit;font-weight:bold;cursor:pointer}
.tab.on{background:var(--c);color:var(--on,#fff)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.big{width:100%;text-align:left;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:22px;padding:16px;margin:10px 0;font:inherit;cursor:pointer;display:block}
.big b{font-size:22px}.big span{display:block;color:var(--mut);margin-top:4px;font-size:16px}
.add{display:flex;gap:8px;flex-wrap:wrap}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
#nt{flex:1 1 200px}
textarea{width:100%;min-height:110px}
.btn{border:0;border-radius:14px;background:var(--c);color:var(--on,#fff);font:inherit;font-weight:bold;padding:10px 16px;cursor:pointer}
.mini{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-size:15px;padding:6px 10px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row .t{flex:1 1 160px}
.done .t{text-decoration:line-through;color:var(--mut)}
.tag{font-size:14px;border-radius:10px;padding:2px 8px;background:var(--line)}
.late{background:#ff5c7a;color:#fff}
.empty{color:var(--mut);font-size:16px}
select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
summary{font-size:20px;cursor:pointer;margin-bottom:6px}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--c)}
.mini.sel{background:var(--c);color:var(--on,#fff);border-color:transparent}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi div{background:var(--bg);border-radius:14px;padding:10px}.kpi b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.c0{color:var(--mut)}
.cd{border:2px solid var(--line);border-radius:10px;padding:4px 0;min-height:44px;font-size:15px}.hj{border-color:var(--qd);font-weight:bold}
.dot{display:block;background:var(--qd);color:#111;border-radius:8px;font-size:12px;margin:2px 5px 0}
.cnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sync{font-size:13px;color:var(--mut);text-align:right;margin:2px 4px 8px}.x{margin-left:auto;border:0;background:transparent;color:var(--mut);opacity:.4;font-size:12px;padding:2px 4px;cursor:pointer;align-self:flex-start}
.tab.lg{flex:2 1 220px;font-size:21px;padding:18px 8px}
.tab.sm{flex:0 0 auto;padding:5px 10px;font-size:13px;border-width:2px;border-radius:14px}
.big.lg{padding:24px 16px;border-width:4px}.big.lg b{font-size:28px}
.big.sm{padding:8px 12px;border-width:2px;border-radius:16px;margin:8px 0;width:auto;display:inline-block}.big.sm b{font-size:15px}.big.sm span{display:inline;margin-left:8px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.grid2 .big{margin:0;height:100%}
.row.urg{background:rgba(255,92,122,.16);border-left:6px solid #ff5c7a;border-radius:12px;padding-left:10px}
.tag.hot{background:#ff5c7a;color:#fff;font-weight:bold}
.total{margin-top:10px;padding:10px;border-radius:12px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;background:#000;color:#c9e723;border-radius:16px;padding:8px 14px;margin:6px 0 4px;font-size:20px;letter-spacing:.5px}.brand img{width:40px;height:40px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:12px;padding:4px 8px;font-size:15px}.chip input{width:20px;height:20px}
.x+.x{margin-left:0}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes toast{0%{transform:translate(-50%,40px);opacity:0}15%,80%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-20px);opacity:0}}
.pf{position:fixed;z-index:99;pointer-events:none;width:10px;height:10px;border-radius:3px;animation:fly .9s ease-out forwards}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:100;background:#000;color:#c9e723;padding:12px 18px;border-radius:30px;font-weight:bold;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:toast 2.2s ease forwards;pointer-events:none;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){.pf{display:none}}
.num{width:110px}small{color:var(--mut)}

:root:root:root{--bg:#0b0b0b;--card:#161616;--ink:#f5f5f5;--mut:#9a9a9a;--line:#2a2a2a;--c:#c9e723;--on:#0a0a0a;--qd:#c9e723}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:var(--c);border-radius:8px;animation:grow .7s ease}
@keyframes grow{from{width:0}}
.vgrid{display:flex;flex-wrap:wrap;gap:8px}.vc{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:bold;cursor:pointer;transition:.2s}.vc.on{background:var(--c);color:#0a0a0a;border-color:var(--c)}.vc input{accent-color:#0a0a0a;width:22px;height:22px}
a.btn{text-decoration:none;display:inline-block}
</style>
</head>

function celebrate(ev,m,big){const r=ev&&ev.target&&ev.target.getBoundingClientRect?ev.target.getBoundingClientRect():null,cx=r?r.left+r.width/2:innerWidth/2,cy=r?r.top+r.height/2:innerHeight/2,n=big?60:22,cols=['#c9e723','#ff5c7a','#7c5cff','#2b8cff','#f0a020','#14b8a6'];

function demV(){const T=today(),P=list.filter(p=>pf==='Todos'||rl(p).map(disp).includes(pf)).sort((a,b)=>(b.urg?1:0)-(a.urg?1:0)||((a.d||'9')<(b.d||'9')?-1:1));

const row=p=>editId===p.id?edit(p):`<div class="row ${p.urg&&!p.ok?'urg':''} ${p.ok?'done':''}"><input type="checkbox" ${p.ok?'checked':''} onchange="setOk(${p.id},this.checked)"><span class="t"><b>${esc(p.c)}</b>: ${esc(p.t)}</span>${p.urg&&!p.ok?'<span class="tag hot">🔥 URGENTE</span>':''}<span class="tag">👤 ${rl(p).map(disp).map(esc).join(', ')}</span>${p.d?`<span class="tag ${p.d<T&&!p.ok?'late':''}">📅 ${fd(p.d)}</span>`:''}${p.ok?'':`<button class="mini ${p.urg?'sel':''}" onclick="setUrg(${p.id},${!p.urg})">🔥</button>`}<button class="x" onclick="edD(${p.id})">✏️</button><button class="x" onclick="delD(${p.id})">🗑</button>${p.ok?`<div style="flex-basis:100%;display:flex;gap:6px;align-items:center"><input placeholder="🔗 Link do arquivo entregue" value="${esc(p.link||'')}" onchange="setLink(${p.id},this.value.trim())" style="flex:1">${okU(p.link)?`<a class="tag" href="${esc(p.link)}" target="_blank" rel="noopener">Abrir</a>`:''}</div>`:''}</div>`;
const o=P.filter(p=>!p.ok),f=P.filter(p=>p.ok);
return `<div class="card add"><select id="dc">${opts(['Geral',...clientes])}</select><input id="dt" placeholder="Qual a demanda?" style="flex:1 1 200px"><input id="dd" type="date">${chips('rs',[])}<label class="chip"><input type="checkbox" id="du"> 🔥 Urgente</label><button class="btn" onclick="addD()">＋ Adicionar</button></div><div class="sub">${['Todos',...NOMES].map(r=>`<button class="mini ${pf===r?'sel':''}" onclick="setPf('${r}')">${r}</button>`).join('')}</div>${pf==='Felipe'?'<h2>🎯 Entregas do mês</h2>'+entV():''}<h2>⏳ Abertas (${o.length})</h2><div class="card">${o.map(row).join('')||'<div class="empty">Tudo em dia! 🌈</div>'}</div><h2>✅ Resolvidas (${f.length})</h2><div class="card">${f.map(row).join('')||'<div class="empty">Vazio.</div>'}</div>`}
function gravV(){const y=cmo.getFullYear(),m=cmo.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),ms=y+'-'+String(m+1).padStart(2,'0');
let h=['D','S','T','Q','Q','S','S'].map(x=>`<b class="c0">${x}</b>`).join('')+'<i></i>'.repeat(f);
for(let i=1;i<=n;i++){const ds=ms+'-'+String(i).padStart(2,'0'),c=gravs.filter(e=>e.date===ds).length;h+=`<div class="cd ${ds===today()?'hj':''}">${i}${c?`<span class="dot">${c}</span>`:''}</div>`}
const L=gravs.filter(e=>e.date.startsWith(ms)).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1);
return `<div class="card add"><select id="gc">${opts(clientes)}</select><input id="gd" type="date"><input id="gh" type="time"><input id="gn" placeholder="Local / observação"><button class="btn" onclick="addG()">＋ Gravação</button></div><div class="card"><div class="cnav"><button class="mini" onclick="shiftM(-1)">◀</button><b>${MES[m]} ${y}</b><button class="mini" onclick="shiftM(1)">▶</button></div><div class="grid">${h}</div></div><div class="card">${L.map(e=>`<div class="row"><span class="tag">${fd(e.date)} ${e.time||''}</span><span class="t">${esc(e.label)}</span><button class="x" onclick="delG(${e.id})">🗑</button></div>`).join('')||'<div class="empty">Nada neste mês.</div>'}</div>`}
function entV(){entNames=Object.keys(videos).filter(k=>videos[k]>0);const[y,mo]=emo.split('-').map(Number);
const nav=`<div class="cnav"><button class="mini" onclick="shiftE(-1)">◀</button><b>${MES[mo-1]} ${y}</b><button class="mini" onclick="shiftE(1)">▶</button></div>`;
if(!entNames.length)return `<div class="card">${nav}<div class="empty">Ainda não há clientes com vídeos combinados. O Leo precisa abrir o app principal uma vez para sincronizar.</div></div>`;
let tot=0,done=0;
const cards=entNames.map((c,ix)=>{const n=videos[c],v=(ents[eid(c)]||{}).v||[],dn=Array.from({length:n},(_,k)=>!!v[k]).filter(Boolean).length;tot+=n;done+=dn;
return `<div class="card"><div class="cnav"><b>${esc(c)}</b><span class="tag" ${dn===n?'style="background:var(--c);color:#0a0a0a"':''}>${dn===n?'🏆 ':''}${dn}/${n} vídeos</span></div><div class="bar"><i style="width:${dn/n*100}%"></i></div><div class="vgrid">${Array.from({length:n},(_,i)=>`<label class="vc ${v[i]?'on':''}"><input type="checkbox" ${v[i]?'checked':''} onchange="tgV(${ix},${i},this.checked)"> ${i+1}</label>`).join('')}</div></div>`}).join('');
return `<div class="card">${nav}<b>📊 ${done}/${tot} vídeos entregues no mês</b><div class="bar"><i style="width:${tot?done/tot*100:0}%"></i></div></div>${cards}`}
function render(){const T=[['dem','✅ Demandas'],['grav','🎬 Gravações']];
$('#app').innerHTML=`<div><div class="brand"><img src="${LOGO}" alt=""><b>Quadra System</b></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><a class="btn" href="${DRIVE_URL}" target="_blank" rel="noopener">📁 Drive da Quadra</a></div>${msg?`<div class="card">${esc(msg)}</div>`:''}<div class="tabs">${T.map(([i,n])=>`<button class="tab ${tab===i?'on':''}" onclick="goTab('${i}')">${n}</button>`).join('')}</div>${tab==='grav'?gravV():demV()}</div>`}
function form(m){$('#app').innerHTML='';A.innerHTML=`<div class="brand" style="margin-top:14px"><img src="${LOGO}" alt=""><b>Quadra System</b></div><div class="card" style="max-width:820px"><b>🔐 Entrar</b><div class="add" style="margin-top:8px"><input id="lgEmail" type="email" placeholder="Email" autocomplete="username"><input id="lgPass" type="password" placeholder="Senha" autocomplete="current-password"><button class="btn" id="lgGo">Entrar</button></div><div class="empty" id="lgMsg" style="margin-top:6px">${m||''}</div><a href="#" id="lgRes" class="empty">Esqueci a senha</a></div>`;
document.getElementById('lgGo').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('lgEmail').value.trim(),document.getElementById('lgPass').value)}catch(e){document.getElementById('lgMsg').textContent='Email ou senha incorretos.'}};
document.getElementById('lgRes').onclick=async e=>{e.preventDefault();const em=document.getElementById('lgEmail').value.trim();if(!em){document.getElementById('lgMsg').textContent='Digite seu email acima e toque de novo.';return}try{await sendPasswordResetEmail(auth,em)}catch(x){}document.getElementById('lgMsg').textContent='Se o email estiver cadastrado, enviamos um link para criar nova senha.'}}
window.render=render;
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];list=[];gravs=[];ents={};clientes=[];videos={};msg='';
if(!u){form();return}
A.innerHTML=`<div class="sync">👤 ${esc(u.email)} · <a href="#" id="lgOut">Sair</a></div>`;document.getElementById('lgOut').onclick=e=>{e.preventDefault();signOut(auth)};
const deny=()=>{msg='Seu email não tem acesso a esta página. Fale com o Leo.';render()};
const arr=(sn)=>sn.docs.map(d=>Object.assign({},d.data(),{id:Number(d.id)}));
unsubs.push(onSnapshot(collection(db,'demandas'),sn=>{list=arr(sn);render()},deny));
unsubs.push(onSnapshot(collection(db,'gravacoes'),sn=>{gravs=arr(sn);render()},()=>{}));
unsubs.push(onSnapshot(collection(db,'entregas'),sn=>{ents={};sn.docs.forEach(d=>ents[d.id]=d.data());render()},()=>{}));
unsubs.push(onSnapshot(doc(db,'config','quadra'),sn=>{const d=sn.exists()?sn.data():{};clientes=d.clientes||[];videos=d.videos||{};render()},()=>{}));
render()});
</script>
</body></html>
