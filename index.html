<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Vida Organizada</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Minha Vida">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ec;--card:#fff;--ink:#2b2b3a;--mut:#75758a;--line:#eadfc8;--home:#7c5cff;--cha:#2fa866;--lav:#2b8cff;--qd:#ff5c7a;--pes:#f0a020;--pp:#14b8a6;--ag:#9b59b6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ff;--mut:#a9a6c2;--line:#3d3b52}}
:root[data-theme="dark"]{--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ff;--mut:#a9a6c2;--line:#3d3b52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:18px}
.wrap{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:6px 0 12px}
h2{font-size:22px;margin:20px 0 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1 1 140px;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:20px;padding:12px 8px;font:inherit;font-weight:bold;cursor:pointer}
.tab.on{background:var(--c);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.big{width:100%;text-align:left;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:22px;padding:16px;margin:10px 0;font:inherit;cursor:pointer;display:block}
.big b{font-size:22px}.big span{display:block;color:var(--mut);margin-top:4px;font-size:16px}
.add{display:flex;gap:8px;flex-wrap:wrap}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
#nt{flex:1 1 200px}
textarea{width:100%;min-height:110px}
.btn{border:0;border-radius:14px;background:var(--c);color:#fff;font:inherit;font-weight:bold;padding:10px 16px;cursor:pointer}
.mini{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-size:15px;padding:6px 10px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row .t{flex:1 1 160px}
.done .t{text-decoration:line-through;color:var(--mut)}
.tag{font-size:14px;border-radius:10px;padding:2px 8px;background:var(--line)}
.late{background:#ff5c7a;color:#fff}
.empty{color:var(--mut);font-size:16px}
select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
summary{font-size:20px;cursor:pointer;margin-bottom:6px}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--c)}
.mini.sel{background:var(--c);color:#fff;border-color:transparent}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi div{background:var(--bg);border-radius:14px;padding:10px}.kpi b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.c0{color:var(--mut)}
.cd{border:2px solid var(--line);border-radius:10px;padding:4px 0;min-height:44px;font-size:15px}.hj{border-color:var(--qd);font-weight:bold}
.dot{display:block;background:var(--qd);color:#fff;border-radius:8px;font-size:12px;margin:2px 5px 0}
.cnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sync{font-size:13px;color:var(--mut);text-align:right;margin:2px 4px 8px}.x{margin-left:auto;border:0;background:transparent;color:var(--mut);opacity:.4;font-size:12px;padding:2px 4px;cursor:pointer;align-self:flex-start}
.tab.lg{flex:2 1 220px;font-size:21px;padding:18px 8px}
.tab.sm{flex:0 0 auto;padding:5px 10px;font-size:13px;border-width:2px;border-radius:14px}
.big.lg{padding:24px 16px;border-width:4px}.big.lg b{font-size:28px}
.big.sm{padding:8px 12px;border-width:2px;border-radius:16px;margin:8px 0;width:auto;display:inline-block}.big.sm b{font-size:15px}.big.sm span{display:inline;margin-left:8px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .big{margin:0;height:100%}
.row.urg{background:rgba(255,92,122,.16);border-left:6px solid #ff5c7a;border-radius:12px;padding-left:10px}
.tag.hot{background:#ff5c7a;color:#fff;font-weight:bold}
.total{margin-top:10px;padding:10px;border-radius:12px;background:var(--bg)}
.num{width:110px}small{color:var(--mut)}
</style></head>
<body><div class="wrap" id="auth" style="padding-bottom:0"><div class="sync">v6 · conectando ao Firebase…</div></div><div class="wrap" id="app"></div>
<script>
const K='vida-org-v2',$=s=>document.querySelector(s),g=i=>$('#'+i).value.trim();
const CO={home:{n:'Início',e:'🏠',c:'--home'},pp:{n:'Pessoal',e:'📝',c:'--pp'},ag:{n:'Agenda',e:'📅',c:'--ag'},cha:{n:'Mr.Matte',e:'🧉',c:'--cha'},lav:{n:'Lavanderia',e:'🧺',c:'--lav'},qd:{n:'Quadra Marketing',e:'📣',c:'--qd'},pes:{n:'Meu Dinheiro',e:'💳',c:'--pes'}};
const SUBS={qd:[['cli','👥 Clientes'],['fin','💰 Financeiro'],['pen','✅ Pendências'],['grav','🎬 Gravações']],cha:[['est','📦 Estoque'],['ev','🎪 Eventos'],['cins','🧃 Compras: insumos'],['ceq','🔧 Compras: equipamentos']],lav:[['lpen','✅ Pendências'],['lcomp','🛒 Compras']],pes:[['mes','📅 Contas do mês'],['pont','🎯 Pontuais'],['ent','💵 Entradas']]};
const COL=['📝 Para fazer','🚀 Fazendo agora','✅ Pronto'],R=['Felipe','Tuts','Fabio','Mari','Eu'],SH=['Eu','Felipe','Tuts','Operação'];
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const C=(n,e,v,d,sp,gr)=>({id:uid(),n,e,v,d,sp,g:gr||'q'});
function uid(){return Date.now()*1000+Math.floor(Math.random()*1000)}
const F=(n,v,f,pg)=>({id:uid(),n,v,f,pg:''});
const seed=()=>({tasks:[],notes:{},pend:[],grav:[],est:[],ev:[],comp:[],pp:[],agp:[],lpen:[],lcomp:[],cins:[],ceq:[],
fx:[F('Condomínio',650),F('Luz',450),F('Academia',180),F('Celular (plano)',125)],
pc:[F('Aliança',320,3),F('Celular',234,6),F('IPTU',237,1),F('IPVA Guiguiba',300,6),F('Drone',360,8),F('TV',607,4)],
pt:[{id:uid(),n:'Topcell',v:150,ok:false}],
en:[{id:uid(),n:'Chá Matte (média)',v:2400},{id:uid(),n:'Passeios com o Julio',v:190,q:4},{id:uid(),n:'Quadra (minha parte)',v:0},{id:uid(),n:'Lavanderia',v:0}],
cli:[C('QB Engenharia','6 vídeos · 10 fotos tratadas · tráfego',4297,5),C('Manzil Árabe','6 vídeos · 10 fotos · tráfego',3000,13),C('Urbanic Imóveis','6 vídeos · 10 artes · tráfego',2635,5),C('HD Registros','6 vídeos · 10 artes · tráfego · dev pontual',4500,10),C('Carvalho e Cesar Advogados','6 vídeos · 10 fotos tratadas · tráfego',3000,20),C('Menfis Construtora','6 reels · 10 fotos tratadas · tráfego',3000,8),C('CT Brasília','6 reels · 10 fotos tratadas',2500,0,{Eu:1000,Felipe:1000,Tuts:500}),C('Marcelo Quorve','24 vídeos por mês',3000,0,{Felipe:2000,Eu:1000},'sub')],
custos:[{id:uid(),n:'Programa',v:670,t:'f',o:''},{id:uid(),n:'Gasolina',v:400,t:'f',o:''},{id:uid(),n:'Parcela da lente',v:500,t:'f',o:'faltam 9'},{id:uid(),n:'Salário Mari (estagiária)',v:1200,t:'f',o:'vai precisar aumentar'},{id:uid(),n:'Salário Fabio (gestor de tráfego)',v:1500,t:'f',o:''}]});
let S=seed(),tab='home',sub={qd:'cli',cha:'est',pes:'mes',lav:'lpen'},pf='Todos',cm={g:new Date(),d:new Date(),p:new Date()};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(seed(),JSON.parse(r))}catch(e){}
if(mig())try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
let LAT=0,ref=null,pend=false,wt=0,syncTxt='💾 Salvo neste aparelho';
try{LAT=+localStorage.getItem(K+'-at')||0}catch(e){}
function setSync(t){syncTxt=t;const e=document.querySelector('#sync');if(e)e.textContent=t}
function stash(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(K+'-at',String(LAT))}catch(e){}}
const snapJ=()=>JSON.stringify(window.sharedPend?Object.assign({},S,{pend:[]}):S);
function cloudPush(){if(window.fbSave){setSync('⏳ Salvando…');window.fbSave(LAT,snapJ())}}
function save(){LAT=Date.now();stash();cloudPush()}
window.appApply=(json,at)=>{try{const keep=window.sharedPend?S.pend:null;S=Object.assign(seed(),JSON.parse(json));if(keep)S.pend=keep;LAT=+at||0;if(mig())save();else stash();render()}catch(e){}};
window.appLocal=()=>({at:LAT,json:snapJ()});
window.appShared=l=>{S.pend=l;window.sharedPend=true;render()};window.appPend=()=>S.pend;window.appNames=()=>S.cli.map(c=>c.n);
window.appSync=setSync;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE'),fd=d=>d.split('-').reverse().slice(0,2).join('/');
const m$=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const sortT=(a,b)=>(a.d||'9')<(b.d||'9')?-1:1;
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
const go=t=>{tab=t;render()},sb=s=>{sub[tab]=s;render()};
const SHR=()=>window.sharedPend&&window.fbPend;
function A(k,o){const x=Object.assign({id:uid()},o);S[k].push(x);if(k==='pend'&&SHR())window.fbPend.set(x);else save();render()}
function D(k,id){if(!confirm('Apagar este item?'))return;S[k]=S[k].filter(x=>x.id!==id);if(k==='pend'&&SHR())window.fbPend.del(id);else save();render()}
const go2=(t,s)=>{tab=t;sub[t]=s;render()};
const sortU=(a,b)=>(b.urg?1:0)-(a.urg?1:0)||sortT(a,b);
function U(k,id,f,v){const x=S[k].find(a=>a.id===id);x[f]=v;if(k==='pend'&&SHR())window.fbPend.set(x);else save();render()}
function note(v){S.notes[tab]=v;save()}
function shift(k,n){const d=cm[k];cm[k]=new Date(d.getFullYear(),d.getMonth()+n,1);render()}
const inp=(id,ph,x='')=>`<input id="${id}" placeholder="${ph}" ${x}>`;
function cal(k,ev,del){const d=cm[k],y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),ms=y+'-'+String(m+1).padStart(2,'0');
let h=['D','S','T','Q','Q','S','S'].map(x=>`<b class="c0">${x}</b>`).join('')+'<i></i>'.repeat(f);
for(let i=1;i<=n;i++){const ds=ms+'-'+String(i).padStart(2,'0'),c=ev.filter(e=>e.date===ds).length;h+=`<div class="cd ${ds===today()?'hj':''}">${i}${c?`<span class="dot">${c}</span>`:''}</div>`}
const L=ev.filter(e=>e.date.startsWith(ms)).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1);
return `<div class="card"><div class="cnav"><button class="mini" onclick="shift('${k}',-1)">◀</button><b>${MES[m]} ${y}</b><button class="mini" onclick="shift('${k}',1)">▶</button></div><div class="grid">${h}</div></div><div class="card">${L.length?L.map(e=>`<div class="row"><span class="tag">${fd(e.date)} ${e.time||''}</span><span class="t">${esc(e.label)}</span>${del?`<button class="x" onclick="D('${del}',${e.id})">🗑</button>`:''}</div>`).join(''):'<div class="empty">Nada neste mês.</div>'}</div>`}
/* QUADRA */
function cliV(){let h='';
[['q','📁 Clientes Quadra'],['sub','📁 Clientes SUB']].forEach(([gr,t])=>{const L=S.cli.filter(c=>c.g===gr);
h+=`<details open class="card"><summary><b>${t}</b> (${L.length})</summary>${L.map(c=>`<div class="row"><span class="t"><b>${esc(c.n)}</b><br><small>${esc(c.e)}</small></span><span class="tag">${m$(c.v)}${c.d?' · dia '+c.d:''}</span><button class="x" onclick="D('cli',${c.id})">🗑</button></div>`).join('')}</details>`});
return h+`<h2>➕ Novo cliente</h2><div class="card add">${inp('cn','Nome')}${inp('ce','Entregas mensais')}<select id="cg"><option value="q">Clientes Quadra</option><option value="sub">Clientes SUB</option></select><button class="btn" onclick="if(g('cn'))A('cli',{n:g('cn'),e:g('ce'),v:0,d:0,g:$('#cg').value})">＋ Adicionar</button></div>`}
function part(c){const b=c.sp?Object.values(c.sp).reduce((a,x)=>a+x,0)||1:4,o={};SH.forEach(k=>o[k]=c.v*(c.sp?(c.sp[k]||0):1)/b);return o}
function custoRows(t){const L=S.custos.filter(c=>c.t===t);return L.length?L.map(c=>`<div class="row"><span class="t">${esc(c.n)}${c.o?` <small>(${esc(c.o)})</small>`:''}</span><input class="num" type="number" value="${c.v}" onchange="U('custos',${c.id},'v',+this.value)"><button class="x" onclick="D('custos',${c.id})">🗑</button></div>`).join(''):'<div class="empty">Nenhum ainda.</div>'}
function finV(){const tot={Eu:0,Felipe:0,Tuts:0,'Operação':0};let ent=0;
S.cli.forEach(c=>{const p=part(c);ent+=+c.v||0;SH.forEach(k=>tot[k]+=p[k])});
const cf=S.custos.filter(c=>c.t==='f').reduce((a,c)=>a+c.v,0),cx=S.custos.filter(c=>c.t==='x').reduce((a,c)=>a+c.v,0),sobra=tot['Operação']-cf-cx;
let h=`<div class="card"><b>💵 Entra por mês: ${m$(ent)}</b><div class="kpi" style="margin-top:8px">${SH.map(k=>`<div>${k==='Operação'?'🏢':'🙂'} ${k}<b>${m$(tot[k])}</b></div>`).join('')}</div></div>`;
h+=`<h2>👥 Por cliente</h2><div class="card">${S.cli.filter(c=>!c.i).map(c=>{const p=part(c);return `<div class="row"><span class="t"><b>${esc(c.n)}</b>${c.g==='sub'?' <small>(SUB)</small>':''}<br><small>${SH.filter(k=>p[k]>0).map(k=>k+' '+m$(p[k])).join(' · ')}</small></span><input class="num" type="number" value="${c.v}" onchange="U('cli',${c.id},'v',+this.value)"><input class="num" style="width:70px" type="number" placeholder="dia" value="${c.d||''}" onchange="U('cli',${c.id},'d',+this.value)"></div>`}).join('')}</div>`;
h+=`<h2>📌 Custos fixos: ${m$(cf)}</h2><div class="card">${custoRows('f')}</div><h2>🎈 Custos flutuantes: ${m$(cx)}</h2><div class="card">${custoRows('x')}</div>`;
h+=`<div class="card add">${inp('kn','Nome do custo')}<input id="kv" type="number" placeholder="Valor" class="num"><select id="kt"><option value="f">Fixo</option><option value="x">Flutuante</option></select><button class="btn" onclick="if(g('kn'))A('custos',{n:g('kn'),v:+g('kv'),t:$('#kt').value,o:''})">＋ Custo</button></div>`;
return h+`<div class="card"><b>${sobra>=0?'🎉':'⚠️'} Operação (${m$(tot['Operação'])}) − custos (${m$(cf+cx)}) = ${m$(sobra)}</b></div>`}
function shareBar(){const ok=window.sharedPend&&window.fbPend;return `<div class="card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="t">${ok?'✅ Ligadas à equipe: todos veem estas demandas':'⚠️ Ainda não ligadas à equipe'}</span><button class="mini" onclick="if(window.fbForce)fbForce();else alert('Entre com seu login primeiro.')">${ok?'🔄 Reenviar tudo':'📤 Enviar para a equipe'}</button></div>`}
function addP(){if(!g('pt'))return;A('pend',{c:$('#pc').value,t:g('pt'),d:$('#pd').value,r:$('#pr').value,urg:$('#pu').checked,ok:false})}
function pendV(){const P=S.pend.filter(p=>pf==='Todos'||p.r===pf).sort(sortU),T=today();
const row=p=>`<div class="row ${p.urg&&!p.ok?'urg':''} ${p.ok?'done':''}"><input type="checkbox" ${p.ok?'checked':''} onchange="U('pend',${p.id},'ok',this.checked)"><span class="t"><b>${esc(p.c)}</b>: ${esc(p.t)}</span>${p.urg&&!p.ok?'<span class="tag hot">🔥 URGENTE</span>':''}<span class="tag">👤 ${esc(p.r)}</span>${p.d?`<span class="tag ${p.d<T&&!p.ok?'late':''}">📅 ${fd(p.d)}</span>`:''}${p.ok?'':`<button class="mini ${p.urg?'sel':''}" onclick="U('pend',${p.id},'urg',${!p.urg})">🔥</button>`}<button class="x" onclick="D('pend',${p.id})">🗑</button></div>`;
const o=P.filter(p=>!p.ok),f=P.filter(p=>p.ok);
return `${shareBar()}<div class="card add"><select id="pc">${opts(['Geral',...S.cli.map(c=>c.n)])}</select>${inp('pt','Qual a demanda?','onkeydown="if(event.key===\'Enter\')addP()"')}<input id="pd" type="date"><select id="pr">${opts(R)}</select><label class="tag" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="pu"> 🔥 Urgente</label><button class="btn" onclick="addP()">＋ Adicionar</button></div>
<div class="sub">${['Todos',...R].map(r=>`<button class="mini ${pf===r?'sel':''}" onclick="pf='${r}';render()">${r}</button>`).join('')}</div>
<h2>⏳ Abertas (${o.length})</h2><div class="card">${o.length?o.map(row).join(''):'<div class="empty">Tudo em dia! 🌈</div>'}</div><h2>✅ Resolvidas (${f.length})</h2><div class="card">${f.map(row).join('')||'<div class="empty">Vazio.</div>'}</div>`}
function gravV(){return `<div class="card add"><select id="gc">${opts(S.cli.map(c=>c.n))}</select><input id="gd" type="date"><input id="gh" type="time">${inp('gn','Local / observação')}<button class="btn" onclick="if(g('gd'))A('grav',{date:g('gd'),time:g('gh'),label:$('#gc').value+(g('gn')?' — '+g('gn'):'')})">＋ Gravação</button></div>`+cal('g',S.grav,'grav')}
/* CHA */
function estV(){return `<div class="card add">${inp('en','Item (ex: erva 500g)')}<input id="eq" type="number" class="num" placeholder="Qtd"><input id="em" type="number" class="num" placeholder="Mínimo"><button class="btn" onclick="if(g('en'))A('est',{n:g('en'),q:+g('eq'),m:+g('em')})">＋ Item</button></div><div class="card">${S.est.length?S.est.map(e=>`<div class="row"><span class="t"><b>${esc(e.n)}</b> ${e.q<=e.m?'<span class="tag late">⚠️ acabando</span>':''}<br><small>mínimo ${e.m}</small></span><button class="mini" onclick="U('est',${e.id},'q',${Math.max(0,e.q-1)})">➖</button><b>${e.q}</b><button class="mini" onclick="U('est',${e.id},'q',${e.q+1})">➕</button><button class="x" onclick="D('est',${e.id})">🗑</button></div>`).join(''):'<div class="empty">Cadastre seus produtos.</div>'}</div>`}
function evV(){const r=S.ev.reduce((a,e)=>a+e.r,0),c=S.ev.reduce((a,e)=>a+e.c,0);
return `<div class="card add">${inp('vn','Nome do evento')}<input id="vd" type="date"><input id="vr" type="number" class="num" placeholder="Vendas"><input id="vc" type="number" class="num" placeholder="Custos"><button class="btn" onclick="if(g('vn'))A('ev',{n:g('vn'),d:g('vd'),r:+g('vr'),c:+g('vc')})">＋ Evento</button></div><div class="card"><div class="kpi"><div>Vendas<b>${m$(r)}</b></div><div>Custos<b>${m$(c)}</b></div><div>Lucro<b>${m$(r-c)}</b></div></div></div><div class="card">${S.ev.map(e=>`<div class="row"><span class="t"><b>${esc(e.n)}</b> ${e.d?`<small>${fd(e.d)}</small>`:''}</span><span class="tag">${m$(e.r-e.c)}</span><button class="x" onclick="D('ev',${e.id})">🗑</button></div>`).join('')||'<div class="empty">Nenhum evento.</div>'}</div>`}

function render(){const y=scrollY,k=tab;let body;

<script type="module">

</script>
