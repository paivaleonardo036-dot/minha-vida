<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIDA DO LEO</title>
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIDA DO LEO">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ec;--card:#fff;--ink:#2b2b3a;--mut:#75758a;--line:#eadfc8;--home:#7c5cff;--cha:#2fa866;--lav:#2b8cff;--qd:#c9e723;--mc:#ff8c42;--pes:#f0a020;--pp:#14b8a6;--ag:#9b59b6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ff;--mut:#a9a6c2;--line:#3d3b52}}
:root[data-theme="dark"]{--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ff;--mut:#a9a6c2;--line:#3d3b52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:18px}
.wrap{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:6px 0 12px}
h2{font-size:22px;margin:20px 0 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1 1 140px;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:20px;padding:12px 8px;font:inherit;font-weight:bold;cursor:pointer}
.tab.on{background:var(--c);color:var(--on,#fff)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.big{width:100%;text-align:left;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:22px;padding:16px;margin:10px 0;font:inherit;cursor:pointer;display:block}
.big b{font-size:22px}.big span{display:block;color:var(--mut);margin-top:4px;font-size:16px}
.add{display:flex;gap:8px;flex-wrap:wrap}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
#nt{flex:1 1 200px}
textarea{width:100%;min-height:110px}
.btn{border:0;border-radius:14px;background:var(--c);color:var(--on,#fff);font:inherit;font-weight:bold;padding:10px 16px;cursor:pointer}
.mini{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-size:15px;padding:6px 10px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row .t{flex:1 1 160px}
.done .t{text-decoration:line-through;color:var(--mut)}
.tag{font-size:14px;border-radius:10px;padding:2px 8px;background:var(--line)}
.late{background:#ff5c7a;color:#fff}
.empty{color:var(--mut);font-size:16px}
select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
summary{font-size:20px;cursor:pointer;margin-bottom:6px}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--c)}
.mini.sel{background:var(--c);color:var(--on,#fff);border-color:transparent}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi div{background:var(--bg);border-radius:14px;padding:10px}.kpi b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.c0{color:var(--mut)}
.cd{border:2px solid var(--line);border-radius:10px;padding:4px 0;min-height:44px;font-size:15px}.hj{border-color:var(--qd);font-weight:bold}
.dot{display:block;background:var(--qd);color:#111;border-radius:8px;font-size:12px;margin:2px 5px 0}
.cnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sync{font-size:13px;color:var(--mut);text-align:right;margin:2px 4px 8px}.x{margin-left:auto;border:0;background:transparent;color:var(--mut);opacity:.4;font-size:12px;padding:2px 4px;cursor:pointer;align-self:flex-start}
.tab.lg{flex:2 1 220px;font-size:21px;padding:18px 8px}
.tab.sm{flex:0 0 auto;padding:5px 10px;font-size:13px;border-width:2px;border-radius:14px}
.big.lg{padding:24px 16px;border-width:4px}.big.lg b{font-size:28px}
.big.sm{padding:8px 12px;border-width:2px;border-radius:16px;margin:8px 0;width:auto;display:inline-block}.big.sm b{font-size:15px}.big.sm span{display:inline;margin-left:8px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.grid2 .big{margin:0;height:100%}
.row.urg{background:rgba(255,92,122,.16);border-left:6px solid #ff5c7a;border-radius:12px;padding-left:10px}
.tag.hot{background:#ff5c7a;color:#fff;font-weight:bold}
.total{margin-top:10px;padding:10px;border-radius:12px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;background:#000;color:#c9e723;border-radius:16px;padding:8px 14px;margin:6px 0 4px;font-size:20px;letter-spacing:.5px}.brand img{width:40px;height:40px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:12px;padding:4px 8px;font-size:15px}.chip input{width:20px;height:20px}
.x+.x{margin-left:0}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes toast{0%{transform:translate(-50%,40px);opacity:0}15%,80%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-20px);opacity:0}}
.pf{position:fixed;z-index:99;pointer-events:none;width:10px;height:10px;border-radius:3px;animation:fly .9s ease-out forwards}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:100;background:#000;color:#c9e723;padding:12px 18px;border-radius:30px;font-weight:bold;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:toast 2.2s ease forwards;pointer-events:none;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){.pf{display:none}}
.num{width:110px}small{color:var(--mut)}
[hidden]{display:none!important}
.lkf{animation:lkf 1.6s ease 2}
@keyframes lkf{50%{box-shadow:0 0 0 4px rgba(201,231,35,.55);border-color:#c9e723}}
.hl{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.sec{font-size:13px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:24px 4px 8px}
.hi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:20px;padding:14px 16px;cursor:pointer;transition:transform .12s}
.hi:active{transform:scale(.985)}
.hi .ic{position:relative;flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-content:center;font-size:23px;line-height:1}
.hi .ic::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);opacity:.2}
.hi .ic i{position:relative;font-style:normal}
.hi .tx{flex:1;min-width:0}.hi b{display:block;font-size:18px;line-height:1.2}
.hi small{display:block;margin-top:3px;font-size:14px;color:var(--mut)}
.hi::after{content:"›";flex:none;font-size:28px;line-height:1;color:var(--mut);opacity:.7}
.hi.xl{background:var(--c);border-color:var(--c);color:var(--on);padding:22px 18px;border-radius:24px;box-shadow:0 8px 24px rgba(201,231,35,.28)}
.hi.xl .ic{width:56px;height:56px;font-size:30px;border-radius:18px}.hi.xl .ic::before{background:#000;opacity:.12}
.hi.xl b{font-size:25px}.hi.xl small{color:rgba(0,0,0,.65);font-size:15px}.hi.xl::after{color:var(--on)}
.hi.lg{padding:18px 16px}.hi.lg .ic{width:48px;height:48px;font-size:26px}.hi.lg b{font-size:21px}
.hi.sm{padding:9px 14px;border-radius:16px;border-left-width:6px}.hi.sm .ic{width:30px;height:30px;font-size:17px;border-radius:10px}.hi.sm b{font-size:15px}.hi.sm small{font-size:12.5px;margin-top:1px}.hi.sm::after{font-size:22px}
.topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:var(--bg);padding:8px 0;margin:2px 0 4px}
.topnav .back{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-weight:bold;font-size:15px;padding:7px 14px;cursor:pointer}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:2px solid var(--c);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-weight:bold;font-size:14px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--c);color:var(--on,#fff)}
details.ms{position:relative}
details.ms>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;color:var(--ink);white-space:nowrap;max-width:230px;margin:0;font-size:inherit}
details.ms>summary .mt{overflow:hidden;text-overflow:ellipsis}
details.ms>summary::-webkit-details-marker{display:none}
details.ms>summary::after{content:"▾";color:var(--mut);margin-left:auto;padding-left:8px}
details.ms[open]>summary{border-color:var(--c,var(--home))}
.ml{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:200px;max-width:calc(100vw - 28px);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 14px 36px rgba(0,0,0,.25)}
.ml label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.ml label:hover{background:var(--bg)}
.ml input{width:24px;height:24px}
#app{padding-bottom:110px}
.adf,.adp{font-family:Inter,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.45;color:#f4f4f5}
.adf *,.adp *{box-sizing:border-box}
.adf{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:#c9e723;color:#0a0a0a;font-weight:700;font-size:15px;padding:11px 18px 11px 12px;box-shadow:0 10px 30px rgba(201,231,35,.3),0 4px 14px rgba(0,0,0,.6);cursor:pointer;transition:transform .15s}
.adf:active{transform:scale(.95)}.adf .av{font-size:22px;line-height:1}
.adp{position:fixed;z-index:95;left:0;right:0;bottom:0;height:min(84vh,700px);background:#121214;border:1px solid #242428;border-bottom:0;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.65);padding-bottom:env(safe-area-inset-bottom,0px);animation:adup .25s ease}
@media(min-width:720px){.adp{left:auto;right:20px;bottom:20px;width:430px;border-radius:22px;border-bottom:1px solid #242428}}
@keyframes adup{from{transform:translateY(30px);opacity:0}}
.adh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #242428}
.ava{width:40px;height:40px;border-radius:12px;background:rgba(201,231,35,.12);border:1px solid rgba(201,231,35,.4);display:grid;place-content:center;font-size:21px;flex:none}
.adh b{font:700 16px "Space Grotesk",Inter,sans-serif;letter-spacing:.06em}.adh small{display:block;font-size:12px;color:#8b8b93}
.adx{margin-left:auto;border:0;background:transparent;color:#f4f4f5;opacity:.8;font-size:18px;padding:4px 8px;cursor:pointer}
.adm{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.adp .bub{max-width:90%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;word-wrap:break-word}
.adp .bub.a{background:#18181b;border:1px solid #242428;border-bottom-left-radius:5px;align-self:flex-start}
.adp .bub.u{background:#c9e723;color:#0a0a0a;font-weight:600;border-bottom-right-radius:5px;align-self:flex-end}
.adp small{color:#8b8b93;font-size:inherit}.adp .bub small{font-size:12.5px}.adp .bub i{color:#d6d6dc}
.adp .adl{color:#ff8fa3}
.adp .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.adp .mini,.adp .ads .mini{border:1px solid #242428;background:#18181b;color:#f4f4f5;border-radius:999px;font:600 13px Inter,sans-serif;padding:7px 12px;cursor:pointer}
.adp .mini.sel{background:#c9e723;color:#0a0a0a;border-color:#c9e723}.adp .mini:disabled{opacity:.35;cursor:default}
.adp .bub ul{margin:8px 0 0;padding:0;list-style:none}.adp .bub li{padding:7px 0;border-top:1px solid #242428;display:flex;gap:9px;align-items:flex-start}
.adp .bub li .mini{padding:3px 9px;flex:none}
.adp .tag{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:#18181b;border:1px solid #242428;color:#c9c9d0;flex:none}
.adp .bar{height:10px;border-radius:99px;background:#202024;overflow:hidden;margin:8px 0 2px}.adp .bar>i{display:block;height:100%;background:linear-gradient(90deg,#9fbf12,#c9e723);border-radius:99px}
.ads{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 2px;scrollbar-width:none}.ads::-webkit-scrollbar{display:none}.ads .mini{white-space:nowrap;flex:none}
.adi{display:flex;gap:8px;padding:10px 12px 12px;align-items:center}
.adi input{flex:1;font:16px Inter,sans-serif;color:#f4f4f5;background:#0d0d0f;border:1px solid #242428;border-radius:999px;padding:11px 16px;min-width:0;outline:none}
.adi input:focus{border-color:#c9e723;box-shadow:0 0 0 3px rgba(201,231,35,.15)}.adi input::placeholder{color:#5d5d66}
.adgo{border:0;border-radius:999px;background:#c9e723;color:#0a0a0a;font:700 16px Inter,sans-serif;padding:11px 16px;cursor:pointer}
.adi .mini{font-size:18px;padding:6px 12px}.adp .mini.rec{background:#ff4d6d;border-color:#ff4d6d;animation:adpulse 1s infinite}
@keyframes adpulse{50%{opacity:.6}}
body.adon .toast{bottom:auto;top:calc(24px + env(safe-area-inset-top,0px))}
</style></head>
