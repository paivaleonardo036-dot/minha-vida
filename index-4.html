<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Vida Organizada</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Minha Vida">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ec;--card:#fff;--ink:#2b2b3a;--mut:#75758a;--line:#eadfc8;--home:#7c5cff;--cha:#2fa866;--lav:#2b8cff;--qd:#ff5c7a;--pes:#f0a020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ff;--mut:#a9a6c2;--line:#3d3b52}}
:root[data-theme="dark"]{--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ff;--mut:#a9a6c2;--line:#3d3b52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:18px}
.wrap{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:6px 0 12px}
h2{font-size:22px;margin:20px 0 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1 1 140px;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:20px;padding:12px 8px;font:inherit;font-weight:bold;cursor:pointer}
.tab.on{background:var(--c);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.big{width:100%;text-align:left;border:3px solid var(--c);background:var(--card);color:var(--ink);border-radius:22px;padding:16px;margin:10px 0;font:inherit;cursor:pointer;display:block}
.big b{font-size:22px}.big span{display:block;color:var(--mut);margin-top:4px;font-size:16px}
.add{display:flex;gap:8px;flex-wrap:wrap}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
#nt{flex:1 1 200px}
textarea{width:100%;min-height:110px}
.btn{border:0;border-radius:14px;background:var(--c);color:#fff;font:inherit;font-weight:bold;padding:10px 16px;cursor:pointer}
.mini{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-size:15px;padding:6px 10px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.row:last-child{border:0}
.row .t{flex:1 1 160px}
.done .t{text-decoration:line-through;color:var(--mut)}
.tag{font-size:14px;border-radius:10px;padding:2px 8px;background:var(--line)}
.late{background:#ff5c7a;color:#fff}
.empty{color:var(--mut);font-size:16px}
select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
summary{font-size:20px;cursor:pointer;margin-bottom:6px}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--c)}
.mini.sel{background:var(--c);color:#fff;border-color:transparent}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi div{background:var(--bg);border-radius:14px;padding:10px}.kpi b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.c0{color:var(--mut)}
.cd{border:2px solid var(--line);border-radius:10px;padding:4px 0;min-height:44px;font-size:15px}.hj{border-color:var(--qd);font-weight:bold}
.dot{display:block;background:var(--qd);color:#fff;border-radius:8px;font-size:12px;margin:2px 5px 0}
.cnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sync{font-size:13px;color:var(--mut);text-align:right;margin:2px 4px 8px}.num{width:110px}small{color:var(--mut)}
</style></head>
<body><div class="wrap" id="auth" style="padding-bottom:0"><div class="sync">v3 · conectando ao Firebase…</div></div><div class="wrap" id="app"></div>
<script>
const K='vida-org-v2',$=s=>document.querySelector(s),g=i=>$('#'+i).value.trim();
const CO={home:{n:'Início',e:'🏠',c:'--home'},cha:{n:'Chá Matte',e:'🧉',c:'--cha'},lav:{n:'Lavanderia',e:'🧺',c:'--lav'},qd:{n:'Quadra Marketing',e:'📣',c:'--qd'},pes:{n:'Meu Dinheiro',e:'💳',c:'--pes'}};
const SUBS={qd:[['cli','👥 Clientes'],['fin','💰 Financeiro'],['pen','✅ Pendências'],['grav','🎬 Gravações'],['dem','📅 Prazos']],cha:[['est','📦 Estoque'],['ev','🎪 Eventos'],['comp','🛒 Compras']],pes:[['mes','📅 Contas do mês'],['pont','🎯 Pontuais'],['ent','💵 Entradas']]};
const COL=['📝 Para fazer','🚀 Fazendo agora','✅ Pronto'],R=['Felipe','Tuts','Fabio','Mari','Eu'],SH=['Eu','Felipe','Tuts','Operação'];
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const C=(n,e,v,d,sp,gr)=>({id:uid(),n,e,v,d,sp,g:gr||'q'});
function uid(){return Date.now()*1000+Math.floor(Math.random()*1000)}
const F=(n,v,f,pg)=>({id:uid(),n,v,f,pg:''});
const seed=()=>({tasks:[],notes:{},pend:[],grav:[],est:[],ev:[],comp:[],
fx:[F('Condomínio',650),F('Luz',450),F('Academia',180),F('Celular (plano)',125)],
pc:[F('Aliança',320,3),F('Celular',234,6),F('IPTU',237,1),F('IPVA Guiguiba',300,6),F('Drone',360,8),F('TV',607,4)],
pt:[{id:uid(),n:'Topcell',v:150,ok:false}],
en:[{id:uid(),n:'Chá Matte (média)',v:2400},{id:uid(),n:'Passeios com o Julio',v:190,q:4},{id:uid(),n:'Quadra (minha parte)',v:0},{id:uid(),n:'Lavanderia',v:0}],
cli:[C('QB Engenharia','6 vídeos · 10 fotos tratadas · tráfego',4297,5),C('Manzil Árabe','6 vídeos · 10 fotos · tráfego',3000,13),C('Urbanic Imóveis','6 vídeos · 10 artes · tráfego',2635,5),C('HD Registros','6 vídeos · 10 artes · tráfego · dev pontual',4500,10),C('Carvalho e Cesar Advogados','6 vídeos · 10 fotos tratadas · tráfego',3000,20),C('Menfis Construtora','6 reels · 10 fotos tratadas · tráfego',3000,8),C('CT Brasília','6 reels · 10 fotos tratadas',2500,0,{Eu:1000,Felipe:1000,Tuts:500}),C('Marcelo Quorve','24 vídeos por mês',3000,0,{Felipe:2000,Eu:1000},'sub')],
custos:[{id:uid(),n:'Programa',v:670,t:'f',o:''},{id:uid(),n:'Gasolina',v:400,t:'f',o:''},{id:uid(),n:'Parcela da lente',v:500,t:'f',o:'faltam 9'},{id:uid(),n:'Salário Mari (estagiária)',v:1200,t:'f',o:'vai precisar aumentar'},{id:uid(),n:'Salário Fabio (gestor de tráfego)',v:1500,t:'f',o:''}]});
let S=seed(),tab='home',sub={qd:'cli',cha:'est',pes:'mes'},pf='Todos',cm={g:new Date(),d:new Date()};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(seed(),JSON.parse(r))}catch(e){}
let LAT=0,ref=null,pend=false,wt=0,syncTxt='💾 Salvo neste aparelho';
try{LAT=+localStorage.getItem(K+'-at')||0}catch(e){}
function setSync(t){syncTxt=t;const e=document.querySelector('#sync');if(e)e.textContent=t}
function stash(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(K+'-at',String(LAT))}catch(e){}}
function cloudPush(){if(window.fbSave){setSync('⏳ Salvando…');window.fbSave(LAT,JSON.stringify(S))}}
function save(){LAT=Date.now();stash();cloudPush()}
window.appApply=(json,at)=>{try{S=Object.assign(seed(),JSON.parse(json));LAT=+at||0;stash();render()}catch(e){}};
window.appLocal=()=>({at:LAT,json:JSON.stringify(S)});
window.appSync=setSync;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE'),fd=d=>d.split('-').reverse().slice(0,2).join('/');
const m$=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const sortT=(a,b)=>(a.d||'9')<(b.d||'9')?-1:1;
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
const go=t=>{tab=t;render()},sb=s=>{sub[tab]=s;render()};
function A(k,o){S[k].push(Object.assign({id:uid()},o));save();render()}
function D(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}
function U(k,id,f,v){S[k].find(a=>a.id===id)[f]=v;save();render()}
function note(v){S.notes[tab]=v;save()}
function shift(k,n){const d=cm[k];cm[k]=new Date(d.getFullYear(),d.getMonth()+n,1);render()}
const inp=(id,ph,x='')=>`<input id="${id}" placeholder="${ph}" ${x}>`;
function cal(k,ev,del){const d=cm[k],y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),ms=y+'-'+String(m+1).padStart(2,'0');
let h=['D','S','T','Q','Q','S','S'].map(x=>`<b class="c0">${x}</b>`).join('')+'<i></i>'.repeat(f);
for(let i=1;i<=n;i++){const ds=ms+'-'+String(i).padStart(2,'0'),c=ev.filter(e=>e.date===ds).length;h+=`<div class="cd ${ds===today()?'hj':''}">${i}${c?`<span class="dot">${c}</span>`:''}</div>`}
const L=ev.filter(e=>e.date.startsWith(ms)).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1);
return `<div class="card"><div class="cnav"><button class="mini" onclick="shift('${k}',-1)">◀</button><b>${MES[m]} ${y}</b><button class="mini" onclick="shift('${k}',1)">▶</button></div><div class="grid">${h}</div></div><div class="card">${L.length?L.map(e=>`<div class="row"><span class="tag">${fd(e.date)} ${e.time||''}</span><span class="t">${esc(e.label)}</span>${del?`<button class="mini" onclick="D('grav',${e.id})">🗑</button>`:''}</div>`).join(''):'<div class="empty">Nada neste mês.</div>'}</div>`}
/* QUADRA */
function cliV(){let h='';
[['q','📁 Clientes Quadra'],['sub','📁 Clientes SUB']].forEach(([gr,t])=>{const L=S.cli.filter(c=>c.g===gr);
h+=`<details open class="card"><summary><b>${t}</b> (${L.length})</summary>${L.map(c=>`<div class="row"><span class="t"><b>${esc(c.n)}</b><br><small>${esc(c.e)}</small></span><span class="tag">${m$(c.v)}${c.d?' · dia '+c.d:''}</span><button class="mini" onclick="D('cli',${c.id})">🗑</button></div>`).join('')}</details>`});
return h+`<h2>➕ Novo cliente</h2><div class="card add">${inp('cn','Nome')}${inp('ce','Entregas mensais')}<select id="cg"><option value="q">Clientes Quadra</option><option value="sub">Clientes SUB</option></select><button class="btn" onclick="if(g('cn'))A('cli',{n:g('cn'),e:g('ce'),v:0,d:0,g:$('#cg').value})">＋ Adicionar</button></div>`}
function part(c){const b=c.sp?Object.values(c.sp).reduce((a,x)=>a+x,0)||1:4,o={};SH.forEach(k=>o[k]=c.v*(c.sp?(c.sp[k]||0):1)/b);return o}
function custoRows(t){const L=S.custos.filter(c=>c.t===t);return L.length?L.map(c=>`<div class="row"><span class="t">${esc(c.n)}${c.o?` <small>(${esc(c.o)})</small>`:''}</span><input class="num" type="number" value="${c.v}" onchange="U('custos',${c.id},'v',+this.value)"><button class="mini" onclick="D('custos',${c.id})">🗑</button></div>`).join(''):'<div class="empty">Nenhum ainda.</div>'}
function finV(){const tot={Eu:0,Felipe:0,Tuts:0,'Operação':0};let ent=0;
S.cli.forEach(c=>{const p=part(c);ent+=+c.v||0;SH.forEach(k=>tot[k]+=p[k])});
const cf=S.custos.filter(c=>c.t==='f').reduce((a,c)=>a+c.v,0),cx=S.custos.filter(c=>c.t==='x').reduce((a,c)=>a+c.v,0),sobra=tot['Operação']-cf-cx;
let h=`<div class="card"><b>💵 Entra por mês: ${m$(ent)}</b><div class="kpi" style="margin-top:8px">${SH.map(k=>`<div>${k==='Operação'?'🏢':'🙂'} ${k}<b>${m$(tot[k])}</b></div>`).join('')}</div></div>`;
h+=`<h2>👥 Por cliente</h2><div class="card">${S.cli.map(c=>{const p=part(c);return `<div class="row"><span class="t"><b>${esc(c.n)}</b>${c.g==='sub'?' <small>(SUB)</small>':''}<br><small>${SH.filter(k=>p[k]>0).map(k=>k+' '+m$(p[k])).join(' · ')}</small></span><input class="num" type="number" value="${c.v}" onchange="U('cli',${c.id},'v',+this.value)"><input class="num" style="width:70px" type="number" placeholder="dia" value="${c.d||''}" onchange="U('cli',${c.id},'d',+this.value)"></div>`}).join('')}</div>`;
h+=`<h2>📌 Custos fixos: ${m$(cf)}</h2><div class="card">${custoRows('f')}</div><h2>🎈 Custos flutuantes: ${m$(cx)}</h2><div class="card">${custoRows('x')}</div>`;
h+=`<div class="card add">${inp('kn','Nome do custo')}<input id="kv" type="number" placeholder="Valor" class="num"><select id="kt"><option value="f">Fixo</option><option value="x">Flutuante</option></select><button class="btn" onclick="if(g('kn'))A('custos',{n:g('kn'),v:+g('kv'),t:$('#kt').value,o:''})">＋ Custo</button></div>`;
return h+`<div class="card"><b>${sobra>=0?'🎉':'⚠️'} Operação (${m$(tot['Operação'])}) − custos (${m$(cf+cx)}) = ${m$(sobra)}</b></div>`}
function addP(){if(!g('pt'))return;A('pend',{c:$('#pc').value,t:g('pt'),d:$('#pd').value,r:$('#pr').value,ok:false})}
function pendV(){const P=S.pend.filter(p=>pf==='Todos'||p.r===pf).sort(sortT),T=today();
const row=p=>`<div class="row ${p.ok?'done':''}"><input type="checkbox" ${p.ok?'checked':''} onchange="U('pend',${p.id},'ok',this.checked)"><span class="t"><b>${esc(p.c)}</b>: ${esc(p.t)}</span><span class="tag">👤 ${esc(p.r)}</span>${p.d?`<span class="tag ${p.d<T&&!p.ok?'late':''}">📅 ${fd(p.d)}</span>`:''}<button class="mini" onclick="D('pend',${p.id})">🗑</button></div>`;
const o=P.filter(p=>!p.ok),f=P.filter(p=>p.ok);
return `<div class="card add"><select id="pc">${opts(['Geral',...S.cli.map(c=>c.n)])}</select>${inp('pt','Qual a demanda?','onkeydown="if(event.key===\'Enter\')addP()"')}<input id="pd" type="date"><select id="pr">${opts(R)}</select><button class="btn" onclick="addP()">＋ Adicionar</button></div>
<div class="sub">${['Todos',...R].map(r=>`<button class="mini ${pf===r?'sel':''}" onclick="pf='${r}';render()">${r}</button>`).join('')}</div>
<h2>⏳ Abertas (${o.length})</h2><div class="card">${o.length?o.map(row).join(''):'<div class="empty">Tudo em dia! 🌈</div>'}</div><h2>✅ Resolvidas (${f.length})</h2><div class="card">${f.map(row).join('')||'<div class="empty">Vazio.</div>'}</div>`}
function gravV(){return `<div class="card add"><select id="gc">${opts(S.cli.map(c=>c.n))}</select><input id="gd" type="date"><input id="gh" type="time">${inp('gn','Local / observação')}<button class="btn" onclick="if(g('gd'))A('grav',{date:g('gd'),time:g('gh'),label:$('#gc').value+(g('gn')?' — '+g('gn'):'')})">＋ Gravação</button></div>`+cal('g',S.grav,true)}
const demV=()=>cal('d',S.pend.filter(p=>p.d).map(p=>({date:p.d,label:(p.ok?'✔ ':'')+p.c+': '+p.t+' ('+p.r+')'})),false);
/* CHA */
function estV(){return `<div class="card add">${inp('en','Item (ex: erva 500g)')}<input id="eq" type="number" class="num" placeholder="Qtd"><input id="em" type="number" class="num" placeholder="Mínimo"><button class="btn" onclick="if(g('en'))A('est',{n:g('en'),q:+g('eq'),m:+g('em')})">＋ Item</button></div><div class="card">${S.est.length?S.est.map(e=>`<div class="row"><span class="t"><b>${esc(e.n)}</b> ${e.q<=e.m?'<span class="tag late">⚠️ acabando</span>':''}<br><small>mínimo ${e.m}</small></span><button class="mini" onclick="U('est',${e.id},'q',${Math.max(0,e.q-1)})">➖</button><b>${e.q}</b><button class="mini" onclick="U('est',${e.id},'q',${e.q+1})">➕</button><button class="mini" onclick="D('est',${e.id})">🗑</button></div>`).join(''):'<div class="empty">Cadastre seus produtos.</div>'}</div>`}
function evV(){const r=S.ev.reduce((a,e)=>a+e.r,0),c=S.ev.reduce((a,e)=>a+e.c,0);
return `<div class="card add">${inp('vn','Nome do evento')}<input id="vd" type="date"><input id="vr" type="number" class="num" placeholder="Vendas"><input id="vc" type="number" class="num" placeholder="Custos"><button class="btn" onclick="if(g('vn'))A('ev',{n:g('vn'),d:g('vd'),r:+g('vr'),c:+g('vc')})">＋ Evento</button></div><div class="card"><div class="kpi"><div>Vendas<b>${m$(r)}</b></div><div>Custos<b>${m$(c)}</b></div><div>Lucro<b>${m$(r-c)}</b></div></div></div><div class="card">${S.ev.map(e=>`<div class="row"><span class="t"><b>${esc(e.n)}</b> ${e.d?`<small>${fd(e.d)}</small>`:''}</span><span class="tag">${m$(e.r-e.c)}</span><button class="mini" onclick="D('ev',${e.id})">🗑</button></div>`).join('')||'<div class="empty">Nenhum evento.</div>'}</div>`}
function compV(){return `<div class="card add">${inp('sn','O que comprar?','style="flex:1 1 200px" onkeydown="if(event.key===\'Enter\'&&g(\'sn\'))A(\'comp\',{n:g(\'sn\'),ok:false})"')}<button class="btn" onclick="if(g('sn'))A('comp',{n:g('sn'),ok:false})">＋ Adicionar</button><button class="mini" onclick="S.comp=S.comp.filter(x=>!x.ok);save();render()">🧹 Limpar comprados</button></div><div class="card">${S.comp.map(x=>`<div class="row ${x.ok?'done':''}"><input type="checkbox" ${x.ok?'checked':''} onchange="U('comp',${x.id},'ok',this.checked)"><span class="t">${esc(x.n)}</span><button class="mini" onclick="D('comp',${x.id})">🗑</button></div>`).join('')||'<div class="empty">Lista vazia.</div>'}</div>`}
/* MEU DINHEIRO */
const ym=()=>today().slice(0,7),tt=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function payPc(id,ck){const x=S.pc.find(a=>a.id===id);if(ck){x.f=Math.max(0,x.f-1);x.pg=ym()}else{x.f++;x.pg=''}save();render()}
function calcPes(){const M=ym(),fx=S.fx,pc=S.pc.filter(x=>x.f>0||x.pg===M);
const ent=tt(S.en,e=>e.v*(e.q==null?1:e.q)),cont=tt(fx,x=>x.v)+tt(pc,x=>x.v),pago=tt(fx.filter(x=>x.pg===M),x=>x.v)+tt(pc.filter(x=>x.pg===M),x=>x.v),pont=tt(S.pt.filter(x=>!x.ok),x=>x.v);
return {M,pc,ent,cont,pago,pont,sobra:ent-cont-pont,falta:cont-pago+pont}}
function mesV(){const c=calcPes(),M=c.M,q=S.pc.filter(x=>x.f<=0&&x.pg!==M);
let h=`<div class="card"><b>${MES[+M.slice(5)-1]} ${M.slice(0,4)}</b><div class="kpi" style="margin-top:8px"><div>💵 Entra<b>${m$(c.ent)}</b></div><div>🧾 Contas<b>${m$(c.cont)}</b></div><div>⏳ Falta pagar<b>${m$(c.falta)}</b></div><div>${c.sobra>=0?'🎉':'⚠️'} Sobra<b style="color:${c.sobra<0?'#e5484d':'inherit'}">${m$(c.sobra)}</b></div></div></div>`;
h+=`<h2>🏠 Contas fixas</h2><div class="card">${S.fx.map(x=>`<div class="row ${x.pg===M?'done':''}"><input type="checkbox" ${x.pg===M?'checked':''} onchange="U('fx',${x.id},'pg',this.checked?ym():'')"><span class="t">${esc(x.n)}</span><input class="num" type="number" value="${x.v}" onchange="U('fx',${x.id},'v',+this.value)"><button class="mini" onclick="D('fx',${x.id})">🗑</button></div>`).join('')}
<div class="add" style="margin-top:8px">${inp('fnm','Nova conta fixa')}<input id="fvl" type="number" class="num" placeholder="Valor"><button class="btn" onclick="if(g('fnm'))A('fx',{n:g('fnm'),v:+g('fvl'),pg:''})">＋</button></div></div>`;
h+=`<h2>💳 Parcelas</h2><div class="card">${c.pc.map(x=>`<div class="row ${x.pg===M?'done':''}"><input type="checkbox" ${x.pg===M?'checked':''} onchange="payPc(${x.id},this.checked)"><span class="t">${esc(x.n)}<br><small>${x.f>0?'faltam '+x.f:'🎉 última paga!'}</small></span><input class="num" type="number" value="${x.v}" onchange="U('pc',${x.id},'v',+this.value)"><button class="mini" onclick="D('pc',${x.id})">🗑</button></div>`).join('')||'<div class="empty">Sem parcelas.</div>'}
${q.length?`<small>🎉 Quitadas: ${q.map(x=>esc(x.n)).join(', ')}</small>`:''}
<div class="add" style="margin-top:8px">${inp('xn','Nova parcela')}<input id="xv" type="number" class="num" placeholder="Valor"><input id="xf" type="number" style="width:90px" placeholder="Faltam"><button class="btn" onclick="if(g('xn'))A('pc',{n:g('xn'),v:+g('xv'),f:+g('xf')||1,pg:''})">＋</button></div></div>`;
return h}
function pontV(){return `<div class="card add">${inp('tn','Qual conta?')}<input id="tv" type="number" class="num" placeholder="Valor"><button class="btn" onclick="if(g('tn'))A('pt',{n:g('tn'),v:+g('tv'),ok:false})">＋ Adicionar</button></div><div class="card">${S.pt.map(x=>`<div class="row ${x.ok?'done':''}"><input type="checkbox" ${x.ok?'checked':''} onchange="U('pt',${x.id},'ok',this.checked)"><span class="t">${esc(x.n)}</span><input class="num" type="number" value="${x.v}" onchange="U('pt',${x.id},'v',+this.value)"><button class="mini" onclick="D('pt',${x.id})">🗑</button></div>`).join('')||'<div class="empty">Nenhuma dívida pontual. 🌈</div>'}</div>`}
function entV(){const t=tt(S.en,e=>e.v*(e.q==null?1:e.q));return `<div class="card"><b>💵 Total por mês: ${m$(t)}</b></div><div class="card">${S.en.map(e=>`<div class="row"><span class="t"><b>${esc(e.n)}</b>${e.q!=null?'<br><small>valor por vez × vezes no mês</small>':''}</span><input class="num" type="number" value="${e.v}" onchange="U('en',${e.id},'v',+this.value)">${e.q!=null?`✕<input class="num" style="width:70px" type="number" value="${e.q}" onchange="U('en',${e.id},'q',+this.value)">`:''}<button class="mini" onclick="D('en',${e.id})">🗑</button></div>`).join('')}</div><div class="card add">${inp('ann','Nova entrada')}<input id="avl" type="number" class="num" placeholder="Valor"><input id="aqt" type="number" style="width:90px" placeholder="Vezes"><button class="btn" onclick="if(g('ann'))A('en',Object.assign({n:g('ann'),v:+g('avl')},g('aqt')?{q:+g('aqt')}:{}))">＋ Entrada</button></div>`}
function exportar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='backup-minha-vida-'+today()+'.json';a.click()}
function importar(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!confirm('Substituir tudo pelo backup?'))return;S=Object.assign(seed(),o);save();render()}catch(e){alert('Arquivo inválido')}})};i.click()}
/* LAVANDERIA */
function taskRow(x){const late=x.d&&x.d<today()&&x.s<2,b=x.s===0?`<button class="mini" onclick="U('tasks',${x.id},'s',1)">▶ Começar</button>`:x.s===1?`<button class="mini" onclick="U('tasks',${x.id},'s',2)">✔ Concluir</button>`:`<button class="mini" onclick="U('tasks',${x.id},'s',0)">↩ Reabrir</button>`;
return `<div class="row ${x.s===2?'done':''}"><span class="t">${esc(x.t)}</span>${x.d?`<span class="tag ${late?'late':''}">📅 ${fd(x.d)}</span>`:''}${b}<button class="mini" onclick="D('tasks',${x.id})">🗑</button></div>`}
function lavV(){let h=`<div class="card add">${inp('nt','O que precisa ser feito?')}<input id="nd" type="date"><button class="btn" onclick="if(g('nt'))A('tasks',{co:'lav',t:g('nt'),d:g('nd'),s:0})">＋ Adicionar</button></div>`;
COL.forEach((n,i)=>{const L=S.tasks.filter(x=>x.s===i).sort(sortT);h+=`<h2>${n} (${L.length})</h2><div class="card">${L.map(taskRow).join('')||'<div class="empty">Vazio por aqui.</div>'}</div>`});
return h+`<h2>🗒️ Anotações</h2><textarea oninput="note(this.value)">${esc(S.notes.lav||'')}</textarea>`}
/* HOME */
function home(){const T=today(),po=S.pend.filter(p=>!p.ok),late=po.filter(p=>p.d&&p.d<T).length,low=S.est.filter(e=>e.q<=e.m).length,lt=S.tasks.filter(x=>x.s<2).length;
const info={qd:`${po.length} pendência(s) aberta(s)${late?` · ⚠️ ${late} atrasada(s)`:''}`,cha:`${low} item(ns) acabando · ${S.comp.filter(x=>!x.ok).length} na lista de compras`,lav:`${lt} tarefa(s) pendente(s)`,pes:(c=>`falta pagar ${m$(c.falta)} · sobra ${m$(c.sobra)}`)(calcPes())};
let h='<h1>Oi! O que vamos organizar hoje? 👋</h1>';
['qd','cha','lav','pes'].forEach(k=>h+=`<button class="big" style="--c:var(${CO[k].c})" onclick="go('${k}')"><b>${CO[k].e} ${CO[k].n}</b><span>${info[k]}</span></button>`);
const hj=po.filter(p=>p.d&&p.d<=T).sort(sortT),gh=S.grav.filter(x=>x.date===T);
h+=`<h2>⏰ Para hoje (e atrasados)</h2><div class="card">${gh.map(x=>`<div class="row"><span class="t">🎬 ${esc(x.label)}</span><span class="tag">${x.time||'hoje'}</span></div>`).join('')}${hj.map(p=>`<div class="row"><span class="t">📣 ${esc(p.c)}: ${esc(p.t)} <small>(${esc(p.r)})</small></span><span class="tag ${p.d<T?'late':''}">📅 ${fd(p.d)}</span></div>`).join('')}${gh.length+hj.length?'':'<div class="empty">Nada urgente. Respira! 🌈</div>'}</div>`;return h}
function render(){const y=scrollY,k=tab;let body;
if(k==='home')body=home();else{const s=sub[k];const V={cli:cliV,fin:finV,pen:pendV,grav:gravV,dem:demV,est:estV,ev:evV,comp:compV,mes:mesV,pont:pontV,ent:entV};
body=`<h1 style="color:var(${CO[k].c})">${CO[k].e} ${CO[k].n}</h1>`+(SUBS[k]?`<div class="sub">${SUBS[k].map(([i,n])=>`<button class="mini ${s===i?'sel':''}" onclick="sb('${i}')">${n}</button>`).join('')}</div>${V[s]()}`:lavV())}
$('#app').innerHTML=`<div style="--c:var(${CO[k].c})"><div class="sync" id="sync">${syncTxt}</div><div class="tabs">${Object.entries(CO).map(([i,v])=>`<button class="tab ${i===k?'on':''}" style="--c:var(${v.c})" onclick="go('${i}')">${v.e} ${v.n}</button>`).join('')}</div>${body}<div class="sync"><button class="mini" onclick="exportar()">⬇ Backup</button> <button class="mini" onclick="importar()">⬆ Restaurar</button></div></div>`;scrollTo(0,y)}
render();

/* ====== COLE AQUI O SEU firebaseConfig (veja o LEIA-ME) ====== */

else{
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let ref=null,unsub=null,tm=0,pend=false;
window.fbSave=(at,json)=>{if(!ref)return;pend=true;clearTimeout(tm);
tm=setTimeout(async()=>{try{await setDoc(ref,{json,at});pend=false;window.appSync('☁️ Salvo na nuvem')}catch(e){pend=false;window.appSync('⚠️ Não salvou na nuvem (fica neste aparelho)')}},700)};
function form(msg){A.innerHTML=`<div class="card" style="margin:14px auto 0;max-width:820px"><b>🔐 Entrar</b><div class="add" style="margin-top:8px"><input id="lgEmail" type="email" placeholder="Email" autocomplete="username"><input id="lgPass" type="password" placeholder="Senha" autocomplete="current-password"><button class="btn" id="lgGo" style="--c:#7c5cff">Entrar</button></div><div class="empty" id="lgMsg" style="margin-top:6px">${msg||''}</div></div>`;
document.getElementById('lgGo').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById('lgEmail').value.trim(),document.getElementById('lgPass').value)}catch(e){document.getElementById('lgMsg').textContent='Email ou senha incorretos.'}}}
onAuthStateChanged(auth,u=>{if(unsub){unsub();unsub=null}ref=null;
if(!u){form();window.appSync('💾 Só neste aparelho (entre para salvar na nuvem)');return}
A.innerHTML=`<div class="sync">👤 ${u.email} · <a href="#" id="lgOut">Sair</a></div>`;document.getElementById('lgOut').onclick=e=>{e.preventDefault();signOut(auth)};
ref=doc(db,'users',u.uid,'data','agenda');
unsub=onSnapshot(ref,sn=>{if(pend)return;const d=sn.exists()?sn.data():null,L=window.appLocal();
if(!d||!d.json||(+d.at||0)<L.at){window.fbSave(L.at,L.json);return}
if(d.json!==L.json)window.appApply(d.json,d.at);window.appSync('☁️ Salvo na nuvem')},()=>window.appSync('⚠️ Nuvem indisponível (fica neste aparelho)'))})}
</script>
